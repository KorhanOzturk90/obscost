# OpenCost speaks plain Prometheus and has no way to send a tenancy header,
# so it cannot talk to a multi-tenant Mimir directly (the chart's values
# cover basic auth and bearer tokens, not X-Scope-OrgID). This is a
# three-line nginx that adds the header and forwards to Mimir's gateway,
# so OpenCost sees an ordinary Prometheus at :8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-monitoring-proxy
  namespace: mimir
data:
  nginx.conf: |
    events {}
    http {
      access_log off;
      server {
        listen 8080;
        location / {
          proxy_set_header X-Scope-OrgID monitoring;
          proxy_pass http://mimir-gateway.mimir.svc/prometheus/;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-monitoring-proxy
  namespace: mimir
  labels: {app: mimir-monitoring-proxy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mimir-monitoring-proxy}
  template:
    metadata:
      labels: {app: mimir-monitoring-proxy}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: mimir-monitoring-proxy}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-monitoring-proxy
  namespace: mimir
spec:
  selector: {app: mimir-monitoring-proxy}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
