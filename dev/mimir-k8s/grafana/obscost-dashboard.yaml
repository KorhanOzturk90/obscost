        {
          "id": 2,
          "title": "Active series per tenant (real, deduplicated)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-monitoring"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir-monitoring"
              },
              "expr": "(sum by (user) (cortex_ingester_active_series unless on (cluster, namespace, job) cortex_partition_ring_partitions) / on () group_left max(cortex_distributor_replication_factor)) or sum by (user) (max by (ingester_id, user) (label_replace(cortex_ingester_active_series and on (cluster, namespace, job) cortex_partition_ring_partitions, \"ingester_id\", \"$1\", \"pod\", \".*?-(rc-[0-9]+-[0-9]+|[0-9]+)$\")))",
              "legendFormat": "{{user}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 20
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
