# promcost config for the k3d rig (used by `make cost`).
#
# Every price here is illustrative — a laptop has no invoice. Read them as
# "each Mimir process is a 120 EUR/month VM". Replace with real instance
# prices when this runs on cloud VMs.
backend:
  url: http://localhost:8090
inventory:
  currency: EUR
  # 11 Mimir processes (3 ingesters, distributor, gateway, ruler, compactor,
  # store-gateway, querier, query-frontend, query-scheduler) plus MinIO,
  # each at the illustrative price. The priced pools below cover 6 of the 12
  # units (3 ingesters, ruler, query-frontend, querier), so `make cost`
  # reports "of the 50% of platform cost we can price".
  platform_cost_month: 1440
  pools:
    ingester_memory:
      replicas: 3
      cost_per_replica_month: 120
    ruler_cpu:
      replicas: 1
      cost_per_replica_month: 120
    # ADR 0003's query path is the frontend and the queriers, priced per
    # component. Leave one out and the pool is a lower bound, and says so.
    query_path:
      components:
        query-frontend:
          replicas: 1
          cost_per_replica_month: 120
        querier:
          replicas: 1
          cost_per_replica_month: 120
