# The alloy chart's ClusterRole grants nodes/metrics but not nodes/proxy,
# and scraping cAdvisor through the API server's node proxy needs the
# latter (403 otherwise).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-node-proxy
rules:
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-node-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-node-proxy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: mimir
