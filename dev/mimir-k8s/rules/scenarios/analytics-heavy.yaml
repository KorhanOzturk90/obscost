# Scenario rule, NOT synced by default: `make scenario-heavy-rule`.
#
# One recording rule that re-emits every analytics series under a new name
# — cheap to evaluate relative to its output, and it roughly doubles the
# tenant's active series. This is ADR 0003 [A]'s "a tenant whose recording
# rules sum by (...) over high-cardinality data can invert the ratio": the
# rule_ingestion vs api_ingestion split should move, and #37's
# record: -> output-series join should be able to name this rule.
namespace: heavy
groups:
  - name: analytics_heavy
    interval: 1m
    rules:
      - record: analytics:avalanche_gauge:copy
        expr: |
          sum by (src, series_id, team) (
            label_replace({__name__=~"avalanche_gauge_metric_.*"}, "src", "$1", "__name__", "(.*)")
          )
