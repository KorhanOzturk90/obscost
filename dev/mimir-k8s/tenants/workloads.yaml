# Generated by scripts/gen-tenants.py — edit the table there, not this file.
apiVersion: v1
kind: Namespace
metadata:
  name: tenants
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avalanche-analytics-bi
  namespace: tenants
  labels: {app: avalanche, tenant: analytics, team: bi}
spec:
  replicas: 1
  selector:
    matchLabels: {app: avalanche, tenant: analytics, team: bi}
  template:
    metadata:
      labels: {app: avalanche, tenant: analytics, team: bi}
    spec:
      containers:
        - name: avalanche
          image: quay.io/prometheuscommunity/avalanche:v0.7.0
          args:
            # 20 x 400 = 8000 active series per replica
            - --gauge-metric-count=20
            - --series-count=400
            - --label-count=5
            - --value-interval=15
            # Effectively no series churn. avalanche replaces every
            # series_id each --series-interval, and Mimir keeps the old
            # ones active for 20m — an hourly setting doubled every
            # tenant for 20m of each hour and wrecked the first scenario
            # run. Churn belongs in a scenario, not the baseline.
            - --series-interval=315360000
            - --metric-interval=0
            - --port=9001
          ports:
            - {name: metrics, containerPort: 9001}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
