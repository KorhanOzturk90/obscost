# Local, single-tenant, self-monitoring Grafana Mimir stack for testing
# promcost against real live rule/metric data. See README.md.
#
# Deliberately NOT modeling multi-tenancy or the microservices split here —
# this is the "get one realistic Mimir instance running with real self-
# monitoring metrics and the mixin's own rules/dashboards" step. Splitting
# into per-component services and enabling multi-tenancy is the planned
# next step, in Kubernetes.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: supersecret123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mimir supersecret123 &&
      mc mb -p local/mimir-blocks local/mimir-alertmanager &&
      echo 'buckets ready'
      "
    restart: "no"

  mimir:
    image: grafana/mimir:3.2.0
    command:
      # -target=all deliberately excludes alertmanager (it's not considered
      # "required for a functional instance") — must be added explicitly.
      - -target=all,alertmanager
      # Real multi-tenancy: every request (push, query, ruler, alertmanager)
      # must carry X-Scope-OrgID. Two tenants are provisioned by
      # fetch-mixin.sh: "infra" (self-monitoring data + the mixin's rules)
      # and "sandbox" (deliberately empty, to prove tenant isolation).
      - -auth.multitenancy-enabled=true
      - -server.http-listen-port=8080
      - -server.grpc-listen-port=9095
      # blocks + alertmanager storage: MinIO (S3-compatible), chosen so this
      # config carries over cleanly to a real S3-backed deployment on
      # Kubernetes later.
      - -common.storage.backend=s3
      - -common.storage.s3.endpoint=minio:9000
      - -common.storage.s3.access-key-id=mimir
      - -common.storage.s3.secret-access-key=supersecret123
      - -common.storage.s3.insecure=true
      - -common.storage.s3.bucket-lookup-type=path
      - -blocks-storage.s3.bucket-name=mimir-blocks
      - -blocks-storage.tsdb.dir=/data/tsdb
      - -blocks-storage.bucket-store.sync-dir=/data/tsdb-sync
      - -alertmanager-storage.s3.bucket-name=mimir-alertmanager
      - -alertmanager.enable-api=true
      - -alertmanager.storage.path=/data/alertmanager
      - -alertmanager.configs.fallback=/etc/mimir/alertmanager-fallback.yaml
      # ruler storage: local filesystem, NOT MinIO. Mimir explicitly
      # supports this for exactly this case (a static, hand-provisioned
      # rule set rather than API-managed per-tenant rules) and it lets us
      # just mount the mixin's compiled rules.yaml/alerts.yaml directly
      # instead of needing mimirtool to push them into object storage.
      # Revisit if/when rule management moves to the ruler API.
      - -ruler-storage.backend=local
      - -ruler-storage.local.directory=/etc/mimir/rules
      - -ruler.enable-api=true
      - -ruler.rule-path=/data/ruler
      - -ruler.alertmanager-url=http://localhost:8080/alertmanager
      - -compactor.data-dir=/data/compactor
      # single-binary instance: nothing else to replicate/shard to.
      - -ingester.ring.replication-factor=1
      - -store-gateway.sharding-ring.replication-factor=1
    ports:
      - "8080:8080" # HTTP API (query, ruler, alertmanager, /metrics)
      - "9095:9095" # gRPC (unused externally, exposed for debugging)
    volumes:
      - mimir-data:/data
      - ./mixin/rules:/etc/mimir/rules:ro
      - ./config/alertmanager-fallback.yaml:/etc/mimir/alertmanager-fallback.yaml:ro
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    # No container-level healthcheck: the grafana/mimir image is
    # distroless (no shell, no wget/curl) so there's nothing to run a
    # CMD healthcheck with. Poll http://localhost:8080/ready from the
    # host instead (see README.md) — Alloy/Grafana below just retry their
    # own connections to Mimir until it's ready.

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345" # Alloy's own UI/API, handy for debugging the scrape/remote_write pipeline
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - mimir

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Viewer (Grafana's usual anonymous default) does NOT get the
      # datasources:explore RBAC permission by default — only Editor/Admin
      # do — so anonymous sessions can't open Explore at all. Editor here,
      # local-dev-only, purely so Explore works without logging in.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./mixin/dashboards:/mixin-dashboards:ro
    depends_on:
      - mimir

volumes:
  minio-data:
  mimir-data:
  grafana-data:
