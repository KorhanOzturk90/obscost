name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  smoke:
    runs-on: ubuntu-latest
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: build promcost
        run: go build -o bin/promcost ./cmd/promcost

      # End-to-end run of the built binary against a checked-in fixture:
      # rule definitions from --dir, executions from ndjson, rendered to
      # json and asserted non-empty.
      - name: report smoke run
        run: |
          set -e
          fixture=internal/cli/testdata/report/clean
          ./bin/promcost report \
            --dir "$fixture/rules" \
            --config "$fixture/promcost.yaml" \
            --telemetry "$fixture/executions.ndjson" \
            --format json > report.json
          jq -e '.tenants | length > 0' report.json
